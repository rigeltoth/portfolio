<div class="bg-gradient-to-r from-ndg to-indigo-900 overflow-hidden">
  <!-- <img class="z-i left-1/4 h-32 mt-40 opacity-5 absolute" src="./assets/img/path1.png">
  <img class="z-i2 h-32 right-0 mt-10 opacity-5 absolute" src="./assets/img/path2.png"> -->
    <!-- neon cards -->
    <!-- <img class="z-i2 h-32 botton-0 left-0 mt-60 opacity-5 absolute" src="./assets/img/path3.png"> -->

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 lg:grid-cols-3 mt-20 lg:mt-32 mx-2 xs:mx-8 lg:mx-20 xl:mx-32 justify-items-center">

        <div data-aos="zoom-in" data-aos-delay="0"
        class="bg-transparent grid sm:col-span-2 sm:w-1/2 lg:w-full my-0 lg:my-auto lg:col-span-1 lg:row-span-2
          card hover:bg-pct hover:shadow-pct hover:shadow-2xl">
          <div class=" text-4xl text-bl text-center pt-6">{{ 'svc.ai.title' | t }} <i class="fas fa-robot text-2xl"></i></div>
          <div class=" text-xl text-white text-center p-3 ">{{ 'svc.ai.body' | t }}</div>
        </div>

        <div data-aos="fade-down-right" data-aos-delay="120"
          class="bg-transparent grid card hover:bg-pink-500 hover:shadow-pink-500 hover:shadow-2xl">
          <div class=" text-4xl text-white text-center pt-6">{{ 'svc.quality.title' | t }} <i class="fas fa-clipboard-check text-2xl"></i></div>
          <div class=" text-xl text-white text-center p-3">{{ 'svc.quality.body' | t }}</div>
        </div>

        <div  data-aos="fade-down-left" data-aos-delay="240"
          class="bg-transparent grid card hover:bg-grn hover:shadow-grn hover:shadow-2xl">
          <div class=" text-4xl text-white text-center pt-6">{{ 'svc.comm.title' | t }} <i class="fas fa-comments text-2xl"></i>
          </div>
          <div class="text-xl text-white text-center p-3">{{ 'svc.comm.body' | t }}</div>
        </div>

        <div data-aos="fade-up-right" data-aos-delay="360"
          class="bg-transparent grid card hover:bg-bl hover:shadow-bl hover:shadow-2xl">
          <div class=" text-4xl text-white text-center pt-6">{{ 'svc.ux.title' | t }} <i class="fas fa-user-check text-2xl"></i></div>
          <div class="text-xl text-white text-center  p-5">{{ 'svc.ux.body' | t }}</div>
        </div>

        <div data-aos="fade-up-left" data-aos-delay="480"
          class="bg-transparent grid card hover:bg-prpl hover:shadow-prpl hover:shadow-2xl">
          <div class=" text-4xl text-white text-center pt-6">{{ 'svc.e2e.title' | t }} <i class="fas fa-rocket text-2xl"></i></div>
          <div class=" text-xl text-white text-center  p-5">{{ 'svc.e2e.body' | t }}</div>
        </div>

      </div>

    <!-- hire me -->
  <div class="grid grid-cols-1 md:grid-cols-2 my-32 justify-items-center mx-3">
    <div data-aos="zoom-in" data-aos-easing="ease-in-out"
    class="flex items-center justify-center">
      <h1 class="text-center text-3xl sm:text-4xl text-white mx-4 sm:mx-16">
        {{ 'svc.cta' | t }}
      </h1>
    </div>
    <div class="flex flex-col md:mx-32 mt-20 w-full sm:w-3/4">
      <swiper-container loop="true" speed="1000" grab-cursor="true" effect="cube" autoplay-delay="3000" autoplay-disable-on-interaction="false" space-between="80" centered-slides="true">
        <swiper-slide class="swiper-slide" *ngFor="let img of Imgs"><img [src]="img.src" [alt]="img.alt" /></swiper-slide>
      </swiper-container>
    </div>
  </div>

</div>
